["🗺️ Mapa em 1 minuto (a história em ordem)",`<p>Pense numa novela em 5 capítulos:</p><ol><li><b>Século XIX:</b> a Alemanha reforma a educação (Humboldt) e a psicologia entra nas escolas e universidades como um conteúdo da filosofia.</li><li><b>1879:</b> Wundt cria o 1º laboratório de psicologia. A psicologia quer virar <b>ciência experimental</b>, como a física.</li><li><b>Conflito:</b> psicólogos ocupam vagas de filósofos e alguns dizem que a lógica e a filosofia podem ser explicadas pela psicologia (<b>psicologismo</b>). Os filósofos reagem.</li><li><b>Husserl (1900 em diante)</b> responde criando a <b>fenomenologia</b>: um jeito rigoroso de estudar a experiência sem partir de teorias prontas.</li><li><b>Heidegger (1927)</b> pega o método e muda o foco: em vez da consciência, estuda o <b>existir humano</b> (daí a fenomenologia <i>existencial</i>). Depois chegam Sartre, Rollo May e a psicologia humanista, que a prova provavelmente pede para você <b>diferenciar</b>.</li></ol>`],
["❓ Por que a fenomenologia surgiu?",`<p><b>Problema:</b> como estudar a mente de forma científica? A psicologia de Wundt usava experimentos de fisiologia e física. Isso funciona para medir reação, mas deixa de fora o que a experiência <i>significa</i> para quem a vive.</p><p><b>Psicologismo</b> é a ideia de que as leis do pensamento (a lógica) são só leis da psicologia, ou seja, que a psicologia explica e fundamenta a filosofia. Analogia: é como dizer que a matemática é só um fato sobre cérebros humanos. Husserl percebeu que isso derrubaria a própria filosofia, e criticou o psicologismo nos <i>Prolegômenos</i> das <i>Investigações Lógicas</i>.</p><p><b>Querela de Marburg (1912):</b> o psicólogo experimental Erich Jaensch ocupou a cátedra do filósofo Hermann Cohen. Natorp, Husserl e outros escreveram o <b>Manifesto de 1913</b> (106 assinaturas) pedindo cátedras separadas: uma para a filosofia e outra para a psicologia. Wundt respondeu (1913) defendendo que a psicologia continuasse junto da filosofia.</p><p><b>Tese do artigo de Cormanich & Castañon:</b> a fenomenologia nasceu <u>também</u> como reação a esses conflitos de universidade, e não só como teoria abstrata. Ela recusa tratar a consciência como coisa da natureza, mas continua dialogando com uma psicologia <i>descritiva</i>.</p>`],
["🔍 Husserl, passo a passo",`<p><b>Lema:</b> “voltar às coisas mesmas”: olhar o fenômeno como ele se mostra, antes de teorias e preconceitos.</p><ol><li><b>Atitude natural:</b> nosso modo normal de viver, em que tomamos o mundo como existente e óbvio.</li><li><b>Epoché:</b> “colocar entre parênteses” essa atitude e as teorias que você traz. Não é negar nem duvidar do mundo; é <u>suspender o julgamento</u> para olhar com mais clareza. Exemplo: ao ouvir um relato de luto, você suspende o “isso é depressão” e deixa o fenômeno aparecer como é para aquela pessoa.</li><li><b>Redução fenomenológica:</b> a partir da suspensão, você chega ao que importa: o <b>sentido</b> e a <b>essência</b> da vivência (intuição das essências, <i>Wesensschau</i>).</li><li><b>Intencionalidade:</b> toda consciência é consciência <i>de alguma coisa</i>. Não existe “pensar” sem pensar em algo, nem objeto sem alguém para quem ele apareça. Isso desfaz a separação rígida sujeito/objeto. Conceito herdado de <b>Brentano</b>.</li></ol><p><b>Atenção:</b> Husserl busca a <b>essência</b> (ciência das essências, não dos fatos) e uma <b>consciência pura/transcendental</b>. Isso é justamente o que Heidegger vai criticar.</p><p><b>Psicologia fenomenológica de Husserl:</b> descreve a vida psíquica sem explicações causais. Usa o mesmo método, mas o propósito é outro: estuda a psique <i>no mundo</i>, enquanto a fenomenologia transcendental estuda a consciência pura.</p>`],
["🌍 Heidegger e a fenomenologia existencial",`<p>Heidegger foi aluno de Husserl, mas mudou a pergunta. Husserl: “o que é a essência do que aparece?”. Heidegger: “<b>o que significa ser?</b>”.</p><ul><li><b>Ser × ente:</b> ente é qualquer coisa que existe (uma cadeira, você). Ser é o sentido de “existir”. Para Heidegger, a metafísica só estudou os entes e esqueceu o Ser.</li><li><b>Dasein (“ser-aí”):</b> o nome que ele dá ao ser humano para <u>não</u> repetir definições prontas (“animal racional”, “indivíduo”). Dasein é o ente para quem o próprio existir é uma questão; é <b>abertura</b>, e a existência é sempre <i>minha</i>.</li><li><b>Ser-no-mundo / ser-com:</b> não existe “eu aqui dentro” e “mundo lá fora”. Existimos sempre já em um mundo, com os outros.</li><li><b>Lançado e possibilidade:</b> ninguém escolheu nascer; fomos lançados e precisamos fazer algo disso. Não somos “prontos”; somos <b>poder-ser</b>.</li><li><b>Angústia × medo:</b> medo tem objeto (um cachorro bravo). Angústia não tem: é o encontro com o nada, com a finitude e com a liberdade. Ela incomoda, mas nos chama a assumir a própria vida. Daí o <b>ser-para-a-morte</b>.</li><li><b>Impróprio × próprio:</b> viver no “a gente faz assim”, no falatório e na superficialidade é a <b>impropriedade</b>. Assumir a finitude e as próprias escolhas é a <b>propriedade</b>.</li><li><b>Hermenêutica e círculo hermenêutico:</b> compreender é sempre interpretar a partir da experiência, sem ponto de partida neutro. Por isso Heidegger <b>abandona a redução</b> de Husserl: a suposta neutralidade apagaria a existência concreta.</li></ul>`],
["⚖️ Husserl × Heidegger (cai muito!)",`<div class="sc"><table><tr><th></th><th>Husserl</th><th>Heidegger</th></tr><tr><td>Foco</td><td>Consciência e essências</td><td>Existência (Dasein) e sentido do ser</td></tr><tr><td>Método</td><td>Descrição, epoché, redução</td><td>Interpretação (hermenêutica); recusa a redução</td></tr><tr><td>Sujeito</td><td>Consciência pura/transcendental</td><td>Ser-no-mundo, histórico e finito</td></tr><tr><td>Tema marcante</td><td>Intencionalidade</td><td>Angústia, morte, autenticidade</td></tr><tr><td>Psicologia</td><td>Fenomenológica</td><td>Fenomenológica <b>existencial</b></td></tr></table></div>`],
["🔥 Existencialismo e Psicologia Existencial",`<p>Movimento filosófico que parte do ser humano concreto, com suas escolhas e sua finitude. Precursores: <b>Kierkegaard</b> e <b>Nietzsche</b>. Nomes: Sartre, Beauvoir, Camus, Marcel, Jaspers, Buber.</p><ul><li><b>Sartre:</b> “a existência precede a essência”. Não nascemos com uma natureza definida; nos construímos ao escolher. Logo, somos livres e responsáveis, e a angústia é inevitável.</li><li><b>Temas:</b> liberdade, escolha, responsabilidade, angústia, solidão, morte, sentido, autenticidade.</li><li><b>Rollo May:</b> psicólogo existencial americano. Para ele, o existencialismo é uma <b>atitude</b> (um esforço de compreender a pessoa existente), não uma escola nem um conjunto de técnicas. Também afirmou que é impossível usar o método husserliano durante a sessão.</li><li><b>Clínica:</b> Binswanger (análise existencial) e Medard Boss (Daseinsanalyse) usaram Heidegger na psiquiatria/psicoterapia.</li></ul>`],
["🌱 Psicologia Humanista: por que a polêmica?",`<p><b>Terceira Força</b> (EUA, anos 1950): reação ao behaviorismo (1ª força) e à psicanálise (2ª). Valoriza a experiência, a pessoa inteira e o crescimento. Nomes: <b>Maslow</b> (hierarquia de necessidades, autorrealização), <b>Rogers</b> (Abordagem Centrada na Pessoa), Allport, Fromm, Perls (Gestalt).</p><p><b>Rogers:</b> a pessoa tem uma <b>tendência atualizante</b> (impulso natural de crescer) e se desenvolve quando o terapeuta oferece 3 condições: <b>congruência, aceitação positiva incondicional e compreensão empática</b>.</p><p><b>A polêmica:</b> no Brasil, muita gente chama a ACP e a Gestalt de “fenomenológico-existenciais”. Os textos da professora discordam:</p><ul><li><b>Evangelista (2020):</b> não são, porque <b>substantivam a existência</b>: tratam o humano como um organismo com uma natureza (tendência a crescer), isto é, um “animal racional”. Para Heidegger, isso é <b>metafísica</b>, e não fenomenologia existencial.</li><li><b>Feijoo:</b> a ACP mantém a separação homem/mundo, com um “eu autêntico interno” e um meio que atrapalha.</li><li><b>Holanda (1997)</b>, em contraste, vê ACP e Gestalt como abordagens “de cunho fenomenológico”, pois valorizam o aqui-e-agora e a experiência. Cuidado: ele distingue <b>fenomenismo</b> (ficar nas aparências) de <b>fenomenologia</b> (questionar o todo e o sentido).</li></ul>`],
["🧪 Fenomenologia na pesquisa e na clínica (Schievano & Goto)",`<p>Os autores revisaram 45 artigos brasileiros (2011-2021). Descobertas:</p><ul><li><b>Nenhum</b> usou o método de Husserl propriamente dito; a maioria usa adaptações (como o método de <b>Giorgi</b>) e a fenomenologia hermenêutico-existencial.</li><li>“Epoché” e “redução” viram sinônimos de “postura/atitude do terapeuta”, o que os autores consideram uma simplificação.</li><li>A redução de Giorgi é <b>parcial</b>: chega ao significado da experiência, não à estrutura essencial.</li><li>Conclusão: o método fenomenológico serve para <b>investigar e validar</b> conceitos. Na clínica, deve-se falar em <b>implicação</b> (uma postura ética diante do outro) e não em <b>aplicação</b> de técnica.</li></ul>`],
["🏛️ Epistemologia da psicologia (Figueiredo, Cabral, Benevides)",`<p><b>Epistemologia</b> = reflexão sobre como se produz conhecimento válido.</p><ul><li><b>Figueiredo (Matrizes do Pensamento Psicológico):</b> as psicologias se organizam em <b>matrizes</b> (cientificistas, românticas e pós-românticas). Cada uma responde 4 perguntas: <b>ontológica</b> (o que é o real?), <b>antropológica</b> (o que é o humano?), <b>de método</b> e <b>epistemológica</b> (que critério de verdade?). Não existe um único critério de cientificidade. A fenomenologia fica nas matrizes <b>compreensivas</b>. Ele critica o <b>metodologismo</b> (culto ao “Método”).</li><li><b>Cabral (2010):</b> a psicologia ficou entre a metafísica e a física-matemática. O behaviorismo e as ciências cognitivas (modelo do computador) tentam reduzir o psíquico ao físico. Para ele, o desafio é verificar sem reduzir.</li><li><b>Benevides (2013):</b> a psicologia nasce de uma tensão entre “logia” (razão, conhecimento) e “psi” (o que a razão expulsa: erro, loucura, paixão). Daí a cisão teoria × prática. Ele usa a filosofia da <b>diferença</b> (Foucault, Nietzsche, Deleuze), e não Heidegger.</li></ul>`],
["📖 Mini-dicionário",`<ul><li><b>Fenômeno:</b> o que se mostra.</li><li><b>Atitude natural:</b> viver tomando o mundo como dado.</li><li><b>Epoché:</b> suspensão de juízos e teorias.</li><li><b>Redução:</b> caminho até o sentido/essência.</li><li><b>Eidético:</b> relativo à essência.</li><li><b>Transcendental:</b> relativo às condições da experiência (consciência pura).</li><li><b>Metafísica:</b> pensar o ser como substância ou essência fixa.</li><li><b>Ontologia:</b> estudo do ser.</li><li><b>Hermenêutica:</b> arte/ciência da interpretação.</li><li><b>Dasein:</b> existência humana como abertura.</li><li><b>Facticidade:</b> a vida concreta, histórica, de fato.</li><li><b>Alétheia:</b> desvelamento, verdade como “tirar do encobrimento”.</li><li><b>Substantivar:</b> tratar algo como coisa com natureza fixa.</li></ul>`],
["🎯 Pegadinhas de prova",`<ul><li>Epoché <b>não</b> é negar o mundo nem ser neutro/acolhedor; é suspender juízos para olhar o fenômeno.</li><li>Heidegger <b>rejeita</b> a redução e a consciência transcendental de Husserl.</li><li>Humanista ≠ existencial: humanismo é mais otimista (crescimento); existencialismo trata de angústia e morte.</li><li>Medo tem objeto; angústia não.</li><li>“Existência” em Heidegger é abertura, <b>não</b> organismo.</li><li>Datas: Wundt 1879 · decreto do Abitur 1825 · Humboldt 1809 · Marburg 1912 · Manifesto 1913 · <i>Ser e Tempo</i> 1927.</li></ul>`]
];
