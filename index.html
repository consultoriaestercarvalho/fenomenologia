<script>
const R=[
["#8b7cff","1. Husserl e a Fenomenologia",[
"<b>Phainómenon</b> = aquilo que se mostra, vem à luz. Fenomenologia = método + filosofia: <b>“voltar às coisas mesmas”</b> (zur Sache selbst).",
"<b>Intencionalidade</b> (herdada de <b>Brentano</b>): toda consciência é consciência <i>de</i> algo; objeto é sempre objeto-para-uma-consciência. Sujeito e objeto se correlacionam.",
"<b>Epoché</b> (suspensão): colocar entre parênteses a <b>tese/atitude natural</b> e todo pré-juízo. Não nega nem duvida do mundo (≠ cético/sofista). É mudança de orientação (<i>Einstellung</i>), não ‘postura’ do terapeuta.",
"<b>Redução fenomenológica</b> (eidética/transcendental): leva à <b>essência</b> (<i>Wesensschau</i>, intuição das essências) e à consciência pura. Fenomenologia = ciência das essências, não dos fatos.",
"Projeto: filosofia como <b>ciência rigorosa</b>, ‘filosofia primeira’; <b>crítica ao psicologismo</b> (Prolegômenos das <i>Investigações Lógicas</i>, 1900-01); <i>A Crise das Ciências Europeias</i> (1936) critica o objetivismo.",
"<b>Psicologia fenomenológica</b>: descritiva, eidética, intencional. Difere da fenomenologia transcendental <b>no propósito, não no método</b>: o psicólogo cuida da interioridade psíquica no mundo (basta o 1º estágio da epoché)."]],
["#ff9f43","2. Contexto histórico: Psicologia × Filosofia (Cormanich & Castañon, 2026)",[
"<b>Humboldt</b> (ministro, 1809): Universidade de Berlim, ideal de <b>Bildung</b>, Wissenschaft; 3 pilares: pesquisa+ensino, autonomia acadêmica, liberdade intelectual. Filosofia obrigatória a todos os cursos.",
"<b>Gymnasium/Abitur</b>: decreto de <b>1825</b> (consulta a Hegel e Herbart) põe lógica e psicologia no currículo — a psicologia entra como disciplina propedêutica e ‘burocrática’.",
"Cátedras de “<b>filosofia, psicologia e pedagogia</b>” → fisiologistas/físicos (Weber, Fechner, Helmholtz, Wundt) ocupam vagas de filósofos. <b>Wundt, Leipzig, 1879</b>: 1º laboratório/instituto.",
"<b>Psicologismo</b>: lógica = “física do pensamento” (Lipps); aderentes: Brentano, Ebbinghaus, Lipps e o jovem Husserl.",
"<b>Querela de Marburg (1912)</b>: psicólogo experimental <b>Erich Jaensch</b> assume a cátedra de <b>Cohen</b>. Natorp, Husserl, Rickert, Windelband, Riehl, Eucken → <b>Manifesto de 1913</b> (106 assinaturas); ideia de ‘sindicato dos filósofos’ foi de Husserl.",
"Manifesto: psicologia deve ter cátedras próprias e a filosofia manter as suas. <b>Wundt (1913)</b>, <i>Die Psychologie im Kampf ums Dasein</i> (‘carta de divórcio’), defende psicologia junto à filosofia.",
"<b>Tese</b>: fenomenologia nasce também como reação institucional e teórica à psicologia experimental; é mediadora: recusa naturalizar a consciência, mas dialoga com a psicologia descritiva. Dilthey: psicologia ‘explicativa’ × ‘descritiva e analítica’."]],
["#38d39f","3. Heidegger e a Fenomenologia Existencial",[
"<i>Ser e Tempo</i> (1927): pergunta pelo <b>sentido do ser</b> (não ‘o que é’). Metafísica estuda os <b>entes</b>, esquece o <b>Ser</b> (diferença ontológica).",
"<b>Dasein (ser-aí)</b>: a existência como abertura onde o ser pode ser. Evita termos como ‘homem/pessoa/indivíduo’ (já carregam definição). Existência é <b>sempre minha</b> e o ser está <b>em jogo</b>.",
"<b>Ser-no-mundo</b> e <b>ser-com</b>: homem e mundo são inseparáveis; sem dicotomia sujeito/objeto, interior/exterior.",
"<b>Possibilidade/poder-ser</b>; ser <b>lançado</b> no mundo; <b>cuidado (Sorge)</b>; compreensão como projeto; inacabamento (‘culpa/dívida’).",
"<b>Angústia</b> ≠ medo: medo tem objeto; angústia revela o nada/a finitude e chama ao poder-ser mais próprio. <b>Ser-para-a-morte</b>.",
"<b>Propriedade × impropriedade</b>: impessoalidade (‘a gente’ / <i>das Man</i>), falatório, curiosidade, ambiguidade = decaída; modo próprio = assumir finitude e escolhas.",
"<b>Hermenêutica</b>: passa da descrição à <b>interpretação</b>; <b>círculo hermenêutico</b>; <b>alétheia</b> (desvelamento: ocultar/desocultar). <b>Rejeita a redução husserliana</b> (neutralidade exclui a existência no mundo) e a consciência transcendental.",
"Influência clínica: <b>Binswanger</b> (análise existencial), <b>Medard Boss</b> (Daseinsanalyse), Minkowski, Jaspers. Metafísica = ‘animal racional’ (Aristóteles)."]],
["#ff6b81","4. Existencialismo",[
"Precursores: <b>Kierkegaard</b> e <b>Nietzsche</b> (reação a Hegel); apogeu entre/pós guerras. Ek-sistir = ‘ser para fora’.",
"<b>Sartre</b>: <b>“a existência precede a essência”</b> — o homem se constrói ao escolher; liberdade, responsabilidade, angústia. Outros: Marcel, Buber, Jaspers, Beauvoir, Camus.",
"Temas: liberdade, escolha, responsabilidade, angústia, solidão, morte, sentido, autenticidade, subjetividade.",
"<b>Rollo May</b>: existencialismo é uma <b>atitude</b>, não escola nem técnica; compreender a pessoa existente. Mais ‘pessimista’ que o humanismo (angústia e morte)."]],
["#4dabf7","5. Psicologia Humanista (Terceira Força) e a polêmica",[
"Surge nos EUA (anos 1950) contra o determinismo do behaviorismo (1ª) e psicanálise (2ª). Nomes: <b>Maslow, Rogers, Allport, Murphy</b>, Fromm, Bühler; Perls (Gestalt-terapia).",
"<b>Rogers (ACP)</b>: 3 condições facilitadoras — <b>congruência, aceitação positiva incondicional, compreensão empática</b>; <b>tendência atualizante</b>; ‘campo fenomenológico’ (via Snygg, Combs; <b>Gendlin</b>: experienciação). <b>Maslow</b>: hierarquia de necessidades, autorrealização.",
"<b>Evangelista (2020)</b>: Humanista <b>não é fenomenológico-existencial</b>, pois <b>substantiva a existência</b> (organismo, ‘animal racional’, tendência atualizante) → ontologia <b>metafísica</b>. Spiegelberg: ‘paralelo espontâneo’.",
"<b>Feijoo</b>: ACP mantém separação homem-mundo (eu autêntico interno × meio que dificulta). Humanismo = otimismo no crescimento; ‘centrado no indivíduo’ vs. existência como coexistência e política (pólis).",
"<b>Holanda (1997)</b>: fenomenologia = retorno, crítica, ‘recomeço radical’; <b>fenomenismo</b> (só aparências) ≠ fenomenologia (interroga o todo). ACP e Gestalt vistas como abordagens de ‘cunho fenomenológico’. Keen: 4 aspectos (fonte de hipóteses, veículo p/ humanismo, novo paradigma, resposta à crise)."]],
["#f5c542","6. Pesquisa e clínica no Brasil (Schievano & Goto, 2024)",[
"Revisão de <b>45 artigos</b> (2011-2021): <b>nenhum usa o método de Husserl</b>; predomina Giorgi (fenomenológico-empírico) e hermenêutico-existencial; entrevista semiestruturada.",
"Epoché/redução são tratadas como sinônimos de <b>‘postura/atitude’</b> do terapeuta — para os autores, <b>erro</b>: epoché é exercício analítico-reflexivo, mudança de orientação.",
"<b>Rollo May</b>: impossível empregar o método husserliano na sessão. Conclusão: método = <b>investigação/validação</b>; na clínica há <b>implicação</b>, não <b>aplicação</b> (atitude ética).",
"Giorgi: redução <b>parcial</b> (chega ao significado da experiência, não à estrutura essencial)."]],
["#b197fc","7. Epistemologia da Psicologia",[
"<b>Figueiredo — Matrizes</b>: cientificistas (naturais), românticas e <b>pós-românticas</b> (vitalista, naturista [Humanista, ACP, GT], <b>compreensivas</b> [fenomenologia, historicismo idiográfico, estruturalismo]). 4 perguntas: <b>ontológica, antropológica, método, epistemológica</b>. Não há critério único de cientificidade. Fenomenologia = ‘coroamento da tradição racionalista, iluminista’.",
"Figueiredo: ‘arqueologia’ (Matrizes) → ‘genealogia’ (<i>Invenção do Psicológico</i>), ética das práticas; ‘renovação do empirismo’; <b>metodologismo</b> criticado.",
"<b>Cabral (2010)</b>: psicologia entre metafísica e física-matemática; behaviorismo e cognitivismo/IA tentam reduzir o psíquico ao físico; ciência moderna = matematização. Cita Husserl/Canguilhem: filosofia nada espera da psicologia.",
"<b>Benevides (2013)</b>: tensão <b>‘psi’ × ‘logia’</b> (razão/conhecimento × erro, loucura, paixão); cisão teoria × prática; lê pela filosofia da <b>diferença</b> (Foucault, Nietzsche, Deleuze), não por Heidegger."]]
];
